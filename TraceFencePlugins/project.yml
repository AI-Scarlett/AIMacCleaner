name: TraceFenceCodexPlugins
options:
  createIntermediateGroups: true
  autoCreateSchemes: false
configs:
  Debug: debug
  Release: release
settings:
  base:
    BUNDLE_IDENTIFIER_PREFIX: com.tracefence
    DEVELOPMENT_TEAM: UQ87N2WZ76
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  MacToolsPluginKit:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../ThirdParty/MacTools/Sources/MacToolsPluginKit
      - path: ../ThirdParty/MacTools/Sources/Shared/Localization
    settings:
      base:
        PRODUCT_NAME: MacToolsPluginKit
        PRODUCT_MODULE_NAME: MacToolsPluginKit
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin-kit.development
        GENERATE_INFOPLIST_FILE: true
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
  TraceFenceCodexMediaWorker:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CodexMediaCleanup/Sources/CodexJSONL.swift
      - path: CodexMediaCleanup/Sources/CodexMediaCleanupModels.swift
      - path: CodexMediaCleanup/Sources/CodexMediaDataImage.swift
      - path: CodexMediaCleanup/Sources/CodexMediaRepairEngine.swift
      - path: CodexMediaCleanup/Sources/CodexProcessMonitor.swift
      - path: CodexMediaCleanup/Worker
    settings:
      base:
        PRODUCT_NAME: TraceFenceCodexMediaWorker
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.codex-media-cleanup.worker
        GENERATE_INFOPLIST_FILE: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACEFENCE_CODEX_MEDIA_WORKER"
  CodexMediaCleanupPluginCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CodexMediaCleanup/Sources
    dependencies:
      - target: MacToolsPluginKit
    settings:
      base:
        PRODUCT_MODULE_NAME: CodexMediaCleanupPlugin
        PRODUCT_NAME: CodexMediaCleanupPluginCore
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.codex-media-cleanup.core
        GENERATE_INFOPLIST_FILE: true
  CodexMediaCleanupPlugin:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CodexMediaCleanup/Bundle
      - path: CodexMediaCleanup/Resources
    dependencies:
      - target: MacToolsPluginKit
        embed: false
      - target: CodexMediaCleanupPluginCore
        link: true
      - target: TraceFenceCodexMediaWorker
        link: false
    settings:
      base:
        PRODUCT_NAME: CodexMediaCleanup
        PRODUCT_MODULE_NAME: CodexMediaCleanupPluginBundle
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.codex-media-cleanup
        GENERATE_INFOPLIST_FILE: true
        WRAPPER_EXTENSION: bundle
    postBuildScripts:
      - name: Copy isolated repair worker
        script: |
          set -euo pipefail
          helper_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Helpers"
          mkdir -p "$helper_dir"
          ditto "$BUILT_PRODUCTS_DIR/TraceFenceCodexMediaWorker" "$helper_dir/TraceFenceCodexMediaWorker"
          chmod 755 "$helper_dir/TraceFenceCodexMediaWorker"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/TraceFenceCodexMediaWorker"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Helpers/TraceFenceCodexMediaWorker"
  CodexMediaCleanupPluginTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CodexMediaCleanup/Tests
    dependencies:
      - target: CodexMediaCleanupPluginCore
      - target: MacToolsPluginKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.codex-media-cleanup.tests
        GENERATE_INFOPLIST_FILE: true
  QuotaMonitorPluginCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: QuotaMonitor/Sources
      - path: ../AIMacCleaner/Services/ProviderQuotaService.swift
    dependencies:
      - target: MacToolsPluginKit
    settings:
      base:
        PRODUCT_MODULE_NAME: QuotaMonitorPlugin
        PRODUCT_NAME: QuotaMonitorPluginCore
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.quota-monitor.core
        GENERATE_INFOPLIST_FILE: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACEFENCE_QUOTA_PLUGIN"
        SWIFT_STRICT_CONCURRENCY: minimal
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
  QuotaMonitorPlugin:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: QuotaMonitor/Bundle
      - path: QuotaMonitor/Resources
    dependencies:
      - target: MacToolsPluginKit
        embed: false
      - target: QuotaMonitorPluginCore
        link: true
    settings:
      base:
        PRODUCT_NAME: QuotaMonitor
        PRODUCT_MODULE_NAME: QuotaMonitorPluginBundle
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.quota-monitor
        GENERATE_INFOPLIST_FILE: true
        WRAPPER_EXTENSION: bundle
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
    postBuildScripts:
      - name: Copy quota monitor engine
        script: |
          set -euo pipefail
          engine_source="$SRCROOT/../AIMacCleaner/Resources/codexbar"
          helper_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Helpers"
          test -x "$engine_source"
          mkdir -p "$helper_dir"
          ditto "$engine_source" "$helper_dir/codexbar"
          chmod 755 "$helper_dir/codexbar"
        inputFiles:
          - "$(SRCROOT)/../AIMacCleaner/Resources/codexbar"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Helpers/codexbar"
  AgentProfilePluginCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AgentProfile/Sources
    dependencies:
      - target: MacToolsPluginKit
    settings:
      base:
        PRODUCT_MODULE_NAME: AgentProfilePlugin
        PRODUCT_NAME: AgentProfilePluginCore
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.agent-profile.core
        GENERATE_INFOPLIST_FILE: true
  AgentProfilePlugin:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AgentProfile/Bundle
      - path: AgentProfile/Resources
    dependencies:
      - target: MacToolsPluginKit
        embed: false
      - target: AgentProfilePluginCore
        link: true
    settings:
      base:
        PRODUCT_NAME: AgentProfile
        PRODUCT_MODULE_NAME: AgentProfilePluginBundle
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.agent-profile
        GENERATE_INFOPLIST_FILE: true
        WRAPPER_EXTENSION: bundle
  AgentProfilePluginTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AgentProfile/Tests
    dependencies:
      - target: AgentProfilePluginCore
      - target: MacToolsPluginKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.plugin.agent-profile.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  CodexMediaCleanupPlugin:
    build:
      targets:
        CodexMediaCleanupPlugin: all
        CodexMediaCleanupPluginTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CodexMediaCleanupPluginTests
    run:
      config: Debug
    archive:
      config: Release
  QuotaMonitorPlugin:
    build:
      targets:
        QuotaMonitorPlugin: all
    run:
      config: Debug
    archive:
      config: Release
  AgentProfilePlugin:
    build:
      targets:
        AgentProfilePlugin: all
        AgentProfilePluginTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AgentProfilePluginTests
    run:
      config: Debug
    archive:
      config: Release
