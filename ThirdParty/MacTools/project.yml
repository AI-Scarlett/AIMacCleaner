name: MacTools
options:
  createIntermediateGroups: true
  autoCreateSchemes: false
configs:
  Debug: debug
  Release: release
include:
- path: Configs/GeneratedPlugins.yml
targets:
  MacToolsPluginKit:
    type: framework
    platform: macOS
    deploymentTarget: '14.0'
    sources:
    - path: Sources/MacToolsPluginKit
    - path: Sources/Shared/Localization
    settings:
      base:
        PRODUCT_NAME: MacToolsPluginKit
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).mactools.plugin-kit"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: 6.0
        DEVELOPMENT_LANGUAGE: zh-Hans
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
      configs:
        Release:
          DEAD_CODE_STRIPPING: true
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
  MacTools:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    configFiles:
      Debug: Configs/AppDebug.xcconfig
      Release: Configs/AppRelease.xcconfig
    sources:
    - path: Sources
      excludes:
      - "**/.gitkeep"
      - MacToolsPluginKit/**
      - Extensions/**
      - "../Plugins/**"
      - Plugins/**/CalendarPluginResources/**
    dependencies:
    - target: MacToolsPluginKit
      embed: true
    - target: RightClickFinderSync
      embed: true
    settings:
      base:
        PRODUCT_NAME: MacTools
        PRODUCT_MODULE_NAME: MacTools
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).mactools"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_VERSION: 6.0
        DEVELOPMENT_LANGUAGE: zh-Hans
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Configs/MacTools-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configs/MacTools.entitlements
        MACTOOLS_URL_SCHEME: mactools
        RIGHT_CLICK_CONFIGURATION_HOME_RELATIVE_PATH: Library/Application Support/MacTools/right-click-menu.json
        SPARKLE_PUBLIC_ED_KEY: YS4ioWunyQC5rP/YQdDbG9panyqCKNyBd0iPTUqIFY0=
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MacTools-Bridging-Header.h
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/Core/MultitouchSupport $(SRCROOT)/Sources/Core/CoreBrightness"
        OTHER_LDFLAGS: "-framework MultitouchSupport -framework CoreBrightness -F
          /System/Library/PrivateFrameworks"
      configs:
        Debug:
          PRODUCT_NAME: "MacTools Dev"
          PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).mactools.dev"
          MACTOOLS_URL_SCHEME: mactools-dev
          RIGHT_CLICK_CONFIGURATION_HOME_RELATIVE_PATH: Library/Application Support/MacTools Dev/right-click-menu.json
        Release:
          DEAD_CODE_STRIPPING: true
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
  RightClickFinderSync:
    type: app-extension
    platform: macOS
    deploymentTarget: '14.0'
    configFiles:
      Debug: Configs/AppDebug.xcconfig
      Release: Configs/AppRelease.xcconfig
    sources:
    - path: Sources/Extensions/RightClickFinderSync
    - path: Sources/Core/RightClick
      excludes:
      - RightClickURLRouter.swift
    - path: Sources/Shared/Localization
    settings:
      base:
        PRODUCT_NAME: RightClickFinderSync
        PRODUCT_MODULE_NAME: RightClickFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).mactools.right-click.finder-sync"
        SWIFT_VERSION: 6.0
        DEVELOPMENT_LANGUAGE: zh-Hans
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/Extensions/RightClickFinderSync/RightClickFinderSync-Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Extensions/RightClickFinderSync/RightClickFinderSync.entitlements
        MACTOOLS_URL_SCHEME: mactools
        RIGHT_CLICK_CONFIGURATION_HOME_RELATIVE_PATH: Library/Application Support/MacTools/right-click-menu.json
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).mactools.dev.right-click.finder-sync"
          CODE_SIGN_ENTITLEMENTS: Sources/Extensions/RightClickFinderSync/RightClickFinderSync-Debug.entitlements
          MACTOOLS_URL_SCHEME: mactools-dev
          RIGHT_CLICK_CONFIGURATION_HOME_RELATIVE_PATH: Library/Application Support/MacTools Dev/right-click-menu.json
        Release:
          DEAD_CODE_STRIPPING: true
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
  # Focused test bundle for the storage plugin. The legacy aggregate MacToolsTests target links
  # every plugin and can be blocked by an unrelated optional private framework; safety-critical
  # disk cleanup tests must stay runnable in isolation.
  DiskCleanHostTestShim:
    type: library.static
    platform: macOS
    deploymentTarget: '14.0'
    sources:
    - path: Plugins/DiskClean/TestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_MODULE_NAME: MacTools
        PRODUCT_NAME: DiskCleanHostTestShim
        SWIFT_VERSION: 6.0
  DiskCleanPluginTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
    - path: Plugins/DiskClean/Tests
      excludes:
      # Xcode 26.6 currently emits an internal region-isolation checker error for two legacy
      # Task-cancellation fixtures in this file. Production WorkerPool still compiles in the
      # focused target; keep this compiler bug from masking every other safety test.
      - DiskCleanWorkerPoolTests.swift
    dependencies:
    - target: DiskCleanHostTestShim
    - target: MacToolsPluginKit
    - target: DiskCleanPluginCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: 6.0
        DEVELOPMENT_LANGUAGE: zh-Hans
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
  # Network traffic uses libpcap and must remain testable without linking every optional
  # plugin/private framework in the legacy aggregate MacToolsTests target.
  NetworkTrafficPluginTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
    - path: Plugins/NetworkTraffic/Tests
    dependencies:
    - target: MacToolsPluginKit
    - target: NetworkTrafficPluginCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefence.mactools.plugins.network-traffic.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: 6.0
        DEVELOPMENT_LANGUAGE: zh-Hans
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        OTHER_LDFLAGS: "$(inherited) -lpcap"

schemes:
  DiskCleanPluginTests:
    build:
      targets:
        DiskCleanPluginTests: test
    test:
      config: Debug
      targets:
      - DiskCleanPluginTests
  NetworkTrafficPluginTests:
    build:
      targets:
        NetworkTrafficPluginTests: test
    test:
      config: Debug
      targets:
      - NetworkTrafficPluginTests
